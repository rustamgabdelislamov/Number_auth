<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код</title>
</head>
<body>
    <h1>Введите код для номера телефона </h1>
    <form method="post">
        {% csrf_token %}
        <label for="code">Код:</label><br>
        <input type="tel" id="code" name="code" required><br><br>

        <input type="submit" value="Отправить">
    </form>
    {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
</body>
</html>
