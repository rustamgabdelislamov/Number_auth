<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реферальный код</title>
</head>
<body>
    <h1>Введите реферальный код</h1>
    <form method="post">
    {% csrf_token %}
    <p>Ваш инвайт-код будет создан автоматически. Если хотите, вы можете ввести чужой инвайт-код ниже:</p>
    <input type="text" id="someone_invite" name="someone_invite" placeholder="Инвайт-код (оставьте пустым, если нет)">
    <button type="submit">Продолжить</button>
    </form>
    {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
    {% endif %}
</body>
</html>
